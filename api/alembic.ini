# Configuracion de Alembic para la API de Aburra Motors.
# La URL de la base de datos NO se escribe aqui: la lee alembic/env.py de
# la variable de entorno DATABASE_URL, para poder pasar de SQLite a
# PostgreSQL sin tocar codigo ni ficheros versionados.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Formato de los nombres de archivo de migracion: fecha + slug legible.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Sin post_write_hooks: las migraciones autogeneradas quedan excluidas de
# ruff en pyproject.toml, asi que no necesitan formateo automatico y evitamos
# depender de que el entrypoint de ruff sea resoluble desde alembic.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
