name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Si se empuja dos veces seguidas, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (incluye la verificación de tipos de TypeScript)
        run: npm run build

  backend:
    name: Backend (ruff y pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Pytest
        run: pytest -q

      - name: Verificar que las migraciones aplican desde cero
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: alembic upgrade head

      - name: Verificar que el seed carga los datos del frontend
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: python scripts/seed.py --reset
